# Se evalúa DESPUÉS de normalizar (upper(trim(pais))). Sin país válido nadie ve la fila (C-03).
# Esperado con los datos sintéticos: 3 descartadas ('CO', 'CO', vacío) y 2 normalizadas que pasan (' ec ', 'pe').
kind: dq_rule
rule_id: DQ-05
project_id: PRJ-PAG-001
cde_id: CDE-03
uc_object: ${data_catalog}.silver.pagos
column_name: pais
dimension: Validez
engine: EXPECTATION
expression: "pais IN ('EC', 'PE')"
severity: CRITICA
threshold: 1.0
failure_action: Descartar la fila (expect_or_drop) y registrarla en cuarentena
owner: dvega@labpagos.example
enabled: true
effective_from: 2026-10-26
