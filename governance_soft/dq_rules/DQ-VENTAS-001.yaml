# Regla de calidad → quality.dq_rules.
# engine: EXPECTATION (vive en el pipeline Lakeflow) | DQ_MONITOR | DQX | CUSTOM (la evalúa gov_reconcile → dq_results).
kind: dq_rule
rule_id: DQ-VENTAS-001
project_id: PRJ-VENTAS
cde_id: CDE-VENTAS-MONTO
uc_object: ${data_catalog}.gold.pedidos
column_name: monto_total
dimension: Validez
engine: CUSTOM
expression: "monto_total >= 0"   # condición que cumple una fila VÁLIDA
severity: ERROR
threshold: 0.999
failure_action: Abrir issue DQ y bloquear certificación
owner: grp-stewards-ventas
enabled: true
effective_from: 2026-11-01
