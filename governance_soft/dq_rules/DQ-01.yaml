# Regla DQ (expediente 15) → quality.dq_rules.
# engine EXPECTATION = vive en el pipeline Lakeflow (silver); CUSTOM = la evalúa gov_reconcile → dq_results;
# DQ_MONITOR = Data Quality Monitoring. expression = condición que cumple una fila VÁLIDA.
# Resultado esperado con los datos sintéticos (manifiesto_esperado.json): 3 filas descartadas.
kind: dq_rule
rule_id: DQ-01
project_id: PRJ-PAG-001
cde_id: CDE-01
uc_object: ${data_catalog}.silver.pagos
column_name: pago_id
dimension: Completitud
engine: EXPECTATION
expression: "pago_id IS NOT NULL"
severity: CRITICA
threshold: 1.0
failure_action: Descartar la fila (expect_or_drop) y registrarla en cuarentena
owner: dvega@labpagos.example
enabled: true
effective_from: 2026-10-26
