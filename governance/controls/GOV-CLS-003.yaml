# Control → risk_control.controls; cada test → risk_control.control_tests.
# gov_reconcile ejecuta el SQL de cada test: debe devolver las VIOLACIONES (0 filas = PASS).
kind: control
control_id: GOV-CLS-003
project_id: PRJ-VENTAS
risk_id: RISK-PRIV-001
policy_id: POL-SEC-003
domain: Clasificación
question: ¿Las columnas restringidas se enmascaran?
description: Política ABAC sensitivity=restricted → máscara salvo grupo autorizado
control_type: Preventivo
native_or_custom: NATIVO
databricks_capability: ABAC + column masks
custom_object: ${gov_catalog}.security.mask_restricted
evidence: information_schema.column_tags + resultado de la prueba
owner: grp-security
frequency: Diaria
failure_action: Bloquear acceso y abrir incidente
status: ACTIVO
tests:
  - test_id: TST-CLS-003-01
    description: Columnas restricted del catálogo de datos (lista para verificar cobertura de la política)
    expected: 0 filas sin política aplicable
    automated: true
    query_or_script_uri: governance/tests/cls_003_restricted_without_tag_policy.sql
    environment: all
