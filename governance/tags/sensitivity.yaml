kind: tag
key: sensitivity
version: "1.0"
description: Nivel de sensibilidad según el esquema corporativo de clasificación (P11)
allowed_values: [public, internal, confidential, restricted]
owner: grp-gov-architects
status: VIGENTE
implementation:
  method: terraform   # ver infra/terraform (fuera de este esqueleto)
