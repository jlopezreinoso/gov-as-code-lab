# Jobs de gobierno (Lakeflow Jobs, cómputo serverless). Validar environment_version disponible en tu workspace.
# BASELINE (siempre): gov_bootstrap, gov_sync, gov_reconcile, gov_retention, gov_access_review.
# CONDICIONALES (borrar los que el proyecto no use): gov_dsar (PII), gov_ai_eval (IA/HITL),
#   gov_genie_benchmarks (GENIE/ONT), gov_ontology_hygiene (ONT), gov_itsm_sync (si las decisiones viven en el ITSM).
# LAB gov_manual_lab: se quitaron gov_ai_eval, gov_genie_benchmarks y gov_ontology_hygiene (IA, Genie y Ontology inactivos en ola 1).
resources:
  jobs:

    # ------------------------------------------------------------ BASELINE
    gov_bootstrap:
      name: gov_bootstrap
      description: Crea/actualiza el catálogo de gobierno, aplica migraciones, propiedades y permisos. Idempotente.
      tags: {cost_center: CC-GOV-001, component: gov-as-code}
      environments:
        - environment_key: default
          spec: {environment_version: "2", dependencies: [pyyaml]}
      tasks:
        - task_key: create_catalog
          environment_key: default
          spark_python_task:
            python_file: ../src/run_sql_file.py
            parameters: ["--file", "${workspace.file_path}/sql/gov_catalog_ddl.sql",
                         "--gov-catalog", "${var.gov_catalog}", "--owner-group", "${var.owner_group}",
                         "--catalog-location", "${var.gov_catalog_location}"]
        - task_key: migrations
          depends_on: [{task_key: create_catalog}]
          environment_key: default
          spark_python_task:
            python_file: ../src/run_sql_file.py
            parameters: ["--migrations-dir", "${workspace.file_path}/sql/migrations",
                         "--gov-catalog", "${var.gov_catalog}", "--env", "${bundle.target}"]
        - task_key: table_properties
          depends_on: [{task_key: migrations}]
          environment_key: default
          spark_python_task:
            python_file: ../src/run_sql_file.py
            parameters: ["--file", "${workspace.file_path}/sql/gov_table_properties.sql", "--gov-catalog", "${var.gov_catalog}"]
        - task_key: grants
          depends_on: [{task_key: table_properties}]
          environment_key: default
          spark_python_task:
            python_file: ../src/gov_grants.py
            parameters: ["--root", "${workspace.file_path}", "--gov-catalog", "${var.gov_catalog}",
                         "--data-catalog", "${var.data_catalog}", "--env", "${bundle.target}",
                         "--deployer-group", "${var.deployer_group}", "--runner-group", "${var.runner_group}",
                         "--app-group", "${var.app_group}", "--readers-group", "${var.readers_group}",
                         "--auditors-group", "${var.auditors_group}"]

    gov_sync:
      name: gov_sync
      description: Aplica en Databricks lo declarado en governance_soft/ y lo registra (MERGE). Lo ejecuta el CI tras cada deploy.
      tags: {cost_center: CC-GOV-001, component: gov-as-code}
      email_notifications: {on_failure: ["${var.alert_email}"]}
      environments:
        - environment_key: default
          spec: {environment_version: "2", dependencies: [pyyaml, databricks-sdk]}
      tasks:
        - task_key: sync
          environment_key: default
          spark_python_task:
            python_file: ../src/gov_sync.py
            parameters: ["--root", "${workspace.file_path}", "--gov-catalog", "${var.gov_catalog}",
                         "--data-catalog", "${var.data_catalog}", "--env", "${bundle.target}", "--commit", "${var.git_commit}"]
        - task_key: control_tests          # gate: si una prueba de control falla, el despliegue queda en rojo
          depends_on: [{task_key: sync}]
          environment_key: default
          spark_python_task:
            python_file: ../src/gov_reconcile.py
            parameters: ["--root", "${workspace.file_path}", "--gov-catalog", "${var.gov_catalog}",
                         "--data-catalog", "${var.data_catalog}", "--env", "${bundle.target}",
                         "--only", "schema,controls", "--fail-on-control-fail"]

    gov_reconcile:
      name: gov_reconcile
      description: Conciliación diaria declarado vs real + alertas de gobierno.
      tags: {cost_center: CC-GOV-001, component: gov-as-code}
      email_notifications: {on_failure: ["${var.alert_email}"]}
      schedule: {quartz_cron_expression: "0 0 6 * * ?", timezone_id: UTC, pause_status: PAUSED}
      environments:
        - environment_key: default
          spec: {environment_version: "2", dependencies: [pyyaml, databricks-sdk]}
      tasks:
        - task_key: reconcile
          environment_key: default
          spark_python_task:
            python_file: ../src/gov_reconcile.py
            parameters: ["--root", "${workspace.file_path}", "--gov-catalog", "${var.gov_catalog}",
                         "--data-catalog", "${var.data_catalog}", "--env", "${bundle.target}"]
        - task_key: alerts                 # falla si hay alertas → correo on_failure
          depends_on: [{task_key: reconcile}]
          run_if: ALL_DONE
          environment_key: default
          spark_python_task:
            python_file: ../src/gov_alerts.py
            parameters: ["--root", "${workspace.file_path}", "--gov-catalog", "${var.gov_catalog}",
                         "--data-catalog", "${var.data_catalog}", "--env", "${bundle.target}"]

    gov_retention:
      name: gov_retention
      description: Purga por política de retención (tags retention_policy/retention_column), respeta legal holds, VACUUM.
      tags: {cost_center: CC-GOV-001, component: gov-as-code}
      email_notifications: {on_failure: ["${var.alert_email}"]}
      schedule: {quartz_cron_expression: "0 0 3 * * ?", timezone_id: UTC, pause_status: PAUSED}
      environments:
        - environment_key: default
          spec: {environment_version: "2", dependencies: [pyyaml]}
      tasks:
        - task_key: purge
          environment_key: default
          spark_python_task:
            python_file: ../src/gov_retention.py
            parameters: ["--root", "${workspace.file_path}", "--gov-catalog", "${var.gov_catalog}",
                         "--data-catalog", "${var.data_catalog}", "--env", "${bundle.target}", "--vacuum"]

    gov_access_review:
      name: gov_access_review
      description: Abre la recertificación trimestral y detecta accesos temporales vencidos (diario).
      tags: {cost_center: CC-GOV-001, component: gov-as-code}
      email_notifications: {on_failure: ["${var.alert_email}"]}
      schedule: {quartz_cron_expression: "0 30 5 * * ?", timezone_id: UTC, pause_status: PAUSED}
      environments:
        - environment_key: default
          spec: {environment_version: "2", dependencies: [pyyaml]}
      tasks:
        - task_key: expire_temporary
          environment_key: default
          spark_python_task:
            python_file: ../src/gov_access_review.py
            parameters: ["--root", "${workspace.file_path}", "--gov-catalog", "${var.gov_catalog}",
                         "--data-catalog", "${var.data_catalog}", "--env", "${bundle.target}", "--mode", "expire"]
        - task_key: open_cycle             # idempotente: solo crea revisiones nuevas del trimestre en curso
          environment_key: default
          spark_python_task:
            python_file: ../src/gov_access_review.py
            parameters: ["--root", "${workspace.file_path}", "--gov-catalog", "${var.gov_catalog}",
                         "--data-catalog", "${var.data_catalog}", "--env", "${bundle.target}", "--mode", "open-cycle"]

    # ------------------------------------------------------------ CONDICIONALES
    gov_dsar:
      name: gov_dsar
      description: "[PII] Ejecuta supresiones aprobadas cuando cambia privacy.dsar_requests."
      tags: {cost_center: CC-GOV-001, component: gov-as-code}
      email_notifications: {on_failure: ["${var.alert_email}"]}
      trigger:
        table_update:
          table_names: ["${var.gov_catalog}.privacy.dsar_requests"]
      environments:
        - environment_key: default
          spec: {environment_version: "2", dependencies: [pyyaml]}
      tasks:
        - task_key: execute
          environment_key: default
          spark_python_task:
            python_file: ../src/gov_dsar.py
            parameters: ["--root", "${workspace.file_path}", "--gov-catalog", "${var.gov_catalog}",
                         "--data-catalog", "${var.data_catalog}", "--env", "${bundle.target}"]

    gov_itsm_sync:
      name: gov_itsm_sync
      description: "[Opcional] Trae decisiones aprobadas desde el ITSM (alternativa a la App)."
      tags: {cost_center: CC-GOV-001, component: gov-as-code}
      email_notifications: {on_failure: ["${var.alert_email}"]}
      schedule: {quartz_cron_expression: "0 0/15 * * * ?", timezone_id: UTC, pause_status: PAUSED}
      environments:
        - environment_key: default
          spec: {environment_version: "2", dependencies: [pyyaml, requests]}
      tasks:
        - task_key: sync
          environment_key: default
          spark_python_task:
            python_file: ../src/gov_itsm_sync.py
            parameters: ["--root", "${workspace.file_path}", "--gov-catalog", "${var.gov_catalog}",
                         "--data-catalog", "${var.data_catalog}", "--env", "${bundle.target}"]
