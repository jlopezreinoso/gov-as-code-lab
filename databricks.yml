# Bundle de Gobierno como Código (Declarative Automation Bundles).
# Copia LAB para gov_manual_lab: 7 jobs de gobierno, SIN la App (costo); decisiones humanas por registro manual.
bundle:
  name: gov-as-code-lab

include:
  - resources/gov_jobs.yml   # LAB: gov_app.yml excluido a propósito (acta LAB-001 / 08_BITACORA §4)

variables:
  gov_catalog:
    description: Catálogo de gobierno (control plane)
    default: gov_dev
  data_catalog:
    description: Catálogo de datos del proyecto que se gobierna
    default: ventas_dev
  owner_group:
    description: Grupo dueño del catálogo de gobierno
    default: grp-gov-admins
  deployer_group:
    description: Grupo de SPs que escriben DEFINICIONES (CI/CD)
    default: grp-gov-deployers
  runner_group:
    description: Grupo de SPs que escriben RESULTADOS y EVENTOS (jobs y pipelines)
    default: grp-gov-runners
  app_group:
    description: Grupo del SP de la App de decisiones humanas
    default: grp-gov-app
  readers_group:
    description: Personas que consultan el catálogo de gobierno (solo lectura)
    default: grp-gov-readers
  auditors_group:
    description: Auditores (evidence + READ METADATA)
    default: grp-gov-auditors
  warehouse_id:
    description: SQL warehouse que usa la App
    default: "<warehouse-id>"
  git_commit:
    description: Commit desplegado (lo inyecta el CI)
    default: local
  deployer_sp:
    description: Application ID del service principal de despliegue (PROD)
    default: ""
  alert_email:
    description: Destinatario de alertas y fallas de los jobs de gobierno
    default: gobierno-datos@empresa.com

targets:
  dev:
    mode: development
    default: true
    workspace:
      host: https://adb-1754516251450588.8.azuredatabricks.net
    variables:                       # LAB: mapeo a los grupos g_gov_lab_* (EXC-06 por SoD)
      gov_catalog: gov_dev           # ADR-006: no usar "governance" (MVP de fraude)
      data_catalog: gov_manual_lab
      owner_group: g_gov_lab_admin
      deployer_group: g_gov_lab_admin
      runner_group: g_gov_lab_etl    # contiene sp_etl_pagos (ADR-003)
      app_group: g_gov_lab_admin     # sin App en el lab
      readers_group: g_gov_lab_admin # EXC-06
      auditors_group: g_gov_lab_admin # EXC-06
      warehouse_id: b67cef0696122ed0 # dasboard: serverless, auto-stop 10 min
      alert_email: jalopez@softconsulting.com.ec

  prd:
    mode: production
    workspace:
      host: https://<workspace-prd>.cloud.databricks.com   # reemplazar
      root_path: /Workspace/Shared/.bundle/${bundle.name}/${bundle.target}
    variables:
      gov_catalog: gov_prd
      data_catalog: ventas_prd
    run_as:
      service_principal_name: ${var.deployer_sp}   # GOV-DEV-001: PROD solo con el SP de despliegue
